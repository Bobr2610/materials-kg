services:
  materials-postgres:
    image: pgvector/pgvector:pg16
    container_name: materials-kg-postgres
    environment:
      POSTGRES_USER: materials
      POSTGRES_PASSWORD: materials
      POSTGRES_DB: materials_kg
    ports:
      - "55432:5432"
    volumes:
      - materials_kg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materials -d materials_kg"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  materials_kg_pgdata:

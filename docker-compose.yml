services:
  materials-neo4j:
    image: neo4j:5-community
    container_name: materials-kg-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - materials_kg_neo4j_data:/data
      - materials_kg_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-changeme} 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  materials-grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: materials-kg-grobid
    ports:
      - "8070:8070"

  materials-api:
    build:
      context: .
    container_name: materials-kg-api
    depends_on:
      materials-neo4j:
        condition: service_healthy
      materials-grobid:
        condition: service_started
    environment:
      MATERIALS_NEO4J_URI: bolt://materials-neo4j:7687
      MATERIALS_NEO4J_USER: ${NEO4J_USER:-neo4j}
      MATERIALS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      MATERIALS_REQUIRE_GRAPH_DB: "true"
      MATERIALS_API_ENSURE_SCHEMA: "true"
      MATERIALS_API_HOST: 0.0.0.0
      MATERIALS_API_PORT: "8090"
      MATERIALS_HYPOTHESIS_ENGINE: ${MATERIALS_HYPOTHESIS_ENGINE:-deepagents}
      MATERIALS_DEEPAGENTS_ENABLED: ${MATERIALS_DEEPAGENTS_ENABLED:-true}
      MATERIALS_DEEPAGENTS_MAX_TOOL_STEPS: ${MATERIALS_DEEPAGENTS_MAX_TOOL_STEPS:-40}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      MATERIALS_VISION_PROVIDER: ${MATERIALS_VISION_PROVIDER:-}
      MATERIALS_VISION_MODEL: ${MATERIALS_VISION_MODEL:-}
      MATERIALS_VISION_API_KEY: ${MATERIALS_VISION_API_KEY:-}
      MATERIALS_VISION_BASE_URL: ${MATERIALS_VISION_BASE_URL:-}
      MATERIALS_DOCUMENT_VISION_ENABLED: ${MATERIALS_DOCUMENT_VISION_ENABLED:-}
      MATERIALS_LLM_EXTRACTION_MAX_BATCHES_PER_DOCUMENT: ${MATERIALS_LLM_EXTRACTION_MAX_BATCHES_PER_DOCUMENT:-0}
      MATERIALS_LLM_EXTRACTION_BATCH_CHARS: ${MATERIALS_LLM_EXTRACTION_BATCH_CHARS:-25000}
      MATERIALS_INGESTION_LLM_TIMEOUT_SECONDS: ${MATERIALS_INGESTION_LLM_TIMEOUT_SECONDS:-60}
      MATERIALS_INGESTION_LLM_MAX_RETRIES: ${MATERIALS_INGESTION_LLM_MAX_RETRIES:-3}
      LLM_EMBEDDING_TRUNCATION_CHARS: ${LLM_EMBEDDING_TRUNCATION_CHARS:-25000}
      MATERIALS_LLM_EXTRACTION_CHUNK_SIZE: ${MATERIALS_LLM_EXTRACTION_CHUNK_SIZE:-25000}
      MATERIALS_LLM_EXTRACTION_CHUNK_OVERLAP: ${MATERIALS_LLM_EXTRACTION_CHUNK_OVERLAP:-2000}
      MATERIALS_GROBID_URL: ${MATERIALS_GROBID_URL:-http://materials-grobid:8070}
      MATERIALS_GROBID_TIMEOUT_SECONDS: ${MATERIALS_GROBID_TIMEOUT_SECONDS:-45}
      MATERIALS_GROBID_MIN_TEXT_CHARS: ${MATERIALS_GROBID_MIN_TEXT_CHARS:-80}
    volumes:
      - ./Задача 1:/app/Задача 1:ro
    ports:
      - "8090:8090"
    restart: unless-stopped

volumes:
  materials_kg_neo4j_data:
  materials_kg_neo4j_logs:

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-kg"
version = "0.1.0"
description = "Graph-first materials knowledge graph for structured ingestion, explainable query, and gap analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "deepagents>=0.2",
    "fastapi>=0.100,<1",
    "httpx>=0.24",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "neo4j>=5.20,<6",
    "python-multipart>=0.0.6",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=5.0,<6",
    "pillow>=10,<12",
    "pytesseract>=0.3.13,<1",
    "reportlab>=4.0,<5",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.24",
    "mypy>=1.11.0,<2",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["kg_engine*"]
exclude = ["kg_engine/tests*"]

[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    ".pytest_cache",
    ".codex_deps",
    "build",
    "dist",
    "*.egg-info",
    ".agents",
    ".cursor",
    ".opencode",
]

include = ["*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "YTT", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]

ignore = [
    "S101",
    "S112",
    "COM812",
    "ISC001",
    "F401",
    "F403",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "ANN202",
    "ANN204",
    "ANN401",
    "N802",
    "RUF001",
    "T201",
    "BLE001",
    "UP032",
    "RUF010",
    "TRY300",
    "TRY401",
    "PTH",
    "DTZ005",
    "PLC0415",
    "E402",
    "E501",
    "EM102",
    "ERA001",
    "INP001",
    "I001",
    "PERF401",
    "PLR1714",
    "RET504",
    "RUF022",
    "RUF034",
    "S104",
    "S324",
    "S608",
    "TC001",
    "TRY003",
    "UP042",
    "S603",
    "S607",
]

unfixable = [
    "F401",
    "F403",
    "F405",
    "T201",
    "T10",
    "BLE001",
    "C4",
    "DTZ",
    "RET",
    "PLR",
    "ANN",
    "COM",
    "ISC",
    "LOG",
    "PERF",
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "PLR2004", "ANN001", "T201", "T10"]

[tool.ruff.lint.isort]
known-first-party = ["kg_engine"]
force-sort-within-sections = true
combine-as-imports = false
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true

[tool.ruff.lint.pylint]
max-args = 10
max-locals = 20
max-branches = 15
max-statements = 60

[tool.pytest.ini_options]
testpaths = ["kg_engine/tests"]
python_files = [
    "test_ingestion_adapters.py",
    "test_ingestion_jobs.py",
    "test_hypothesis_reports.py",
    "test_ingest_materials_cli_loading.py",
    "test_deepagents_hypothesis_factory.py",
    "test_llm_provider_selection.py",
    "test_materials_api_smoke.py",
    "test_materials_graph_database_behavior.py",
    "test_materials_kg_core.py",
    "test_metrics_evaluation.py",
    "test_neo4j_repository.py",
    "test_no_donor_brand_in_core.py",
    "test_repository_factory.py",
    "test_research_product.py",
]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "tmp: marks temporary tests (cleaned up after task)",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0,<2",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
